<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Thẩm định AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 80% 20%, #60a5fa 0%, transparent 40%),
                        radial-gradient(circle at 10% 80%, #38bdf8 0%, transparent 40%),
                        linear-gradient(135deg, #1d4ed8 0%, #2563eb 40%, #0ea5e9 100%);
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px, 60px 60px;
            pointer-events: none;
        }
        .auth-card {
            position: relative;
            z-index: 10;
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 36px 32px 32px 32px;
            box-shadow: 0 20px 45px rgba(2, 62, 138, 0.25);
        }
        .auth-header { text-align: center; margin-bottom: 22px; }
        .auth-header h2 { font-size: 23px; font-weight: 800; color: #0f172a; text-transform: uppercase; margin-bottom: 6px; }
        .auth-header p { font-size: 13px; color: #64748b; font-weight: 500; }
        .alert-box {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper .input-icon { position: absolute; left: 14px; color: #64748b; font-size: 15px; }
        .input-wrapper input {
            width: 100%;
            padding: 11px 40px;
            font-size: 14px;
            color: #1e293b;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .input-wrapper input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .toggle-password { position: absolute; right: 14px; color: #64748b; cursor: pointer; font-size: 14px; }
        .btn-submit {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
            margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .switch-auth { text-align: center; margin-top: 18px; font-size: 13px; color: #475569; }
        .switch-auth a { color: #2563eb; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="auth-header">
            <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
            <p>Tạo tài khoản để trải nghiệm dịch vụ thẩm định AI</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label">Tên người dùng:</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" name="username" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Số điện thoại:</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" name="phone" placeholder="Nhập số điện thoại" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu:</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="regPassword" name="password" placeholder="Nhập mật khẩu" required>
                    <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePassword('regPassword', this)"></i>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Xác nhận mật khẩu:</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="regConfirmPassword" name="confirm_password" placeholder="Xác nhận lại mật khẩu" required>
                    <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePassword('regConfirmPassword', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">Đăng ký ngay</button>

            <div class="switch-auth">
                Đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }
    </script>
</body>
</html>
