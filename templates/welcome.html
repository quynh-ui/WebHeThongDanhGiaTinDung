<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào Mừng - Hệ Thống Đánh Giá Tín Dụng Thông Minh</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #0d3b66 0%, #081d33 60%, #030d1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Lưới sóng và hạt phát sáng nền */
        .bg-glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(14, 165, 233, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Thẻ trung tâm */
        .welcome-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(13, 37, 63, 0.55);
            border-radius: 28px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(14, 165, 233, 0.15);
        }

        /* Logo thương hiệu */
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            text-decoration: none;
        }
        .brand-badge i {
            font-size: 26px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            padding: 10px;
            border-radius: 14px;
        }
        .brand-text {
            text-align: left;
            line-height: 1.15;
        }
        .brand-text .title {
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #e0f2fe;
            text-transform: uppercase;
        }
        .brand-text .subtitle {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* Tiêu đề chính */
        .main-headline {
            font-size: 24px;
            font-weight: 800;
            color: #67e8f9;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .sub-headline {
            font-size: 14px;
            color: #bae6fd;
            margin-bottom: 25px;
        }

        /* Khu vực hình minh họa & hoạt ảnh */
        .illustration-stage {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        /* Quầng sáng elip xoay quanh nhân vật */
        .orbit-ring {
            position: absolute;
            width: 320px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: rotate(-10deg);
        }

        /* Các biểu tượng bay lơ lửng */
        @keyframes floatUpDown {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .avatar-box {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar-user, .avatar-robot {
            animation: floatUpDown 3.5s ease-in-out infinite;
        }
        .avatar-robot {
            animation-delay: 1.5s;
        }

        .floating-icon {
            position: absolute;
            animation: floatUpDown 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
        }
        .icon-coin-1 { top: 10px; left: 18%; font-size: 24px; color: #fbbf24; animation-delay: 0.5s; }
        .icon-coin-2 { bottom: 15px; right: 18%; font-size: 26px; color: #f59e0b; animation-delay: 1.2s; }
        .icon-chart { top: 25px; left: 30%; font-size: 22px; color: #34d399; animation-delay: 0.8s; }
        .icon-shield { bottom: 20px; left: 24%; font-size: 24px; color: #10b981; animation-delay: 1.8s; }

        /* Thanh tiến trình tải */
        .progress-bar-container {
            width: 65%;
            height: 7px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin: 0 auto 12px auto;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 72%;
            background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%);
            border-radius: 10px;
            box-shadow: 0 0 10px #38bdf8;
            animation: loadingProgress 3s ease-in-out infinite alternate;
        }
        @keyframes loadingProgress {
            0% { width: 35%; }
            100% { width: 90%; }
        }

        .status-loading-text {
            font-size: 13px;
            color: #93c5fd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        /* Nút BẮT ĐẦU NGAY */
        .btn-start {
            background: #ffffff;
            color: #0369a1;
            font-weight: 800;
            font-size: 15.5px;
            padding: 12px 42px;
            border-radius: 30px;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 25px rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-start:hover {
            transform: translateY(-3px) scale(1.03);
            background: #e0f2fe;
            color: #0284c7;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 30px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="bg-glow-orb"></div>

    <div class="welcome-card">
        <!-- Logo & Thương hiệu -->
        <div class="brand-badge">
            <i class="fa-solid fa-chart-line"></i>
            <div class="brand-text">
                <div class="title">HỆ THỐNG ĐÁNH GIÁ</div>
                <div class="subtitle">TÍN DỤNG THÔNG MINH</div>
            </div>
        </div>

        <!-- Tiêu đề chính theo mẫu -->
        <h1 class="main-headline">Chào mừng bạn đến với hệ thống thẩm định tín dụng AI</h1>
        <p class="sub-headline">Phân tích hồ sơ và nhận kết quả duyệt vay chỉ trong 30 giây!</p>

        <!-- Sân khấu hình ảnh & Icons lơ lửng -->
        <div class="illustration-stage">
            <div class="orbit-ring"></div>

            <i class="fa-solid fa-coins floating-icon icon-coin-1"></i>
            <i class="fa-solid fa-chart-column floating-icon icon-chart"></i>
            <i class="fa-solid fa-shield-halved floating-icon icon-shield"></i>
            <i class="fa-solid fa-circle-dollar-to-slot floating-icon icon-coin-2"></i>

            <div class="avatar-box">
                <!-- Nhân vật minh họa -->
                <div class="avatar-user">
                    <i class="fa-solid fa-user-tie text-info" style="font-size: 78px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));"></i>
                </div>
                <!-- Robot AI -->
                <div class="avatar-robot">
                    <img src="{{ url_for('static', filename='images/robot1.png') }}" 
                         alt="Robot AI" 
                         style="width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(56, 189, 248, 0.5));"
                         onerror="this.outerHTML='<i class=\'fa-solid fa-robot text-warning\' style=\'font-size: 70px;\'></i>'">
                </div>
            </div>
        </div>

        <!-- Thanh trạng thái đang chuẩn bị -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
        <div class="status-loading-text">
            <i class="fa-solid fa-circle-notch fa-spin text-info"></i>
            <span>Đang chuẩn bị không gian an toàn cho bạn...</span>
        </div>

        <!-- Nút Bắt Đầu Ngay dẫn tới Trang Đăng Nhập -->
        <div>
            <a href="{{ url_for('login') }}" class="btn-start">
                BẮT ĐẦU NGAY <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    </div>

</body>
</html>
